{% extends "base.html" %}

{% block titulo %}
Editar Producto
{% endblock %}

{% block content %}

<a href="{{ url_for('detalle_producto', producto_id=producto.id) }}"
   class="btn btn-outline-secondary mb-3">
    ← Volver al producto
</a>

<div class="card">

    <div class="card-body">

        <h2 class="mb-4">
            ✏️ Editar Producto
        </h2>

        <form method="POST" enctype="multipart/form-data">

            <div class="mb-3">

                <label class="form-label">
                    Nombre
                </label>

                <input type="text"
                       class="form-control"
                       name="nombre"
                       value="{{ producto.nombre }}"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Precio base
                </label>

                <input type="number"
                       class="form-control"
                       name="precio_base"
                       value="{{ producto.precio_base }}"
                       step="0.01"
                       min="0"
                       required>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Stock
                </label>

                <input type="number"
                       class="form-control"
                       name="stock"
                       value="{{ producto.stock }}"
                       min="0"
                       required>

            </div>

            {% if producto.imagen %}

            <div class="mb-3">

                <label class="form-label">
                    Imagen actual
                </label>

                <div>
                    <img src="{{ url_for('static', filename='uploads/' + producto.imagen) }}"
                         alt="{{ producto.nombre }}"
                         class="img-thumbnail"
                         style="max-width: 200px;">
                </div>

            </div>

            {% endif %}

            <div class="mb-3">

                <label for="imagen"
                       class="form-label">

                    Cambiar imagen del producto

                </label>

                <input type="file"
                       class="form-control"
                       id="imagen"
                       name="imagen"
                       accept=".png,.jpg,.jpeg,.webp">

                <div class="form-text">
                    Si no seleccionas una imagen nueva, se conservará la actual.
                </div>

            </div>

            <button type="submit"
                    class="btn btn-primary">

                Guardar cambios

            </button>

            <a href="{{ url_for('detalle_producto', producto_id=producto.id) }}"
               class="btn btn-secondary">

                Cancelar

            </a>

        </form>

    </div>

</div>

{% endblock %}
